# # 用于 Rime 的 LaTeX 符号输入配置
#
# *author: wklchris@github*
# 
# 配置 <input-schema>.custom.yaml 文件来在 [RIME 输入法](https://rime.im/) 中使用 LaTeX 指令输入数学符号。
#
# > 注意：本配置文件虽然参照 LaTeX 数学符号命令，但也添加了一些额外的命令。因此，本文件中的输入指令并非与 LaTeX 严格对应（例如，平行四边形符号 `/parm` 、性别符号 `/gender` 等）。
#
# 支持的符号（详细列表请参考[完整的符号支持列表](#完整的符号支持列表)一节）：
#
# - 常用数学符号，包括几何、微积分。
# - 特殊字体符号 `/mathbb`，包括数集 ℕ（`/bbn`）等
# - 被 LaTeX 主数学宏包 amsmath/amssymb 支持的一些常用符号：
#   * 运算符与关系符
#   * 箭头符号
# - 希腊字母：除全称命令（如 `/alpha`）外，额外添加了：
#   * 小写希腊字母集（包括变体） `/greek`
#   * 大写希腊字母集 `/greekc`
#   * 变体希腊字母集 `/greekv`
# - 罗马字母：小写 `/roman` 与大写 `/romanc` 罗马字母集
# - 少量其他符号：性别 `/gender`、货币 `$`、温度 `/degree` 等。
#
# 目录：
#
# - [使用方法](#使用方法)
# - [完整的符号支持列表](#完整的符号支持列表)
# - [贡献与许可证](#贡献与许可证)
#
# ## 使用方法
# 
# 此处以 Windows 上的微软双拼 RIME（小狼毫 Weasel）用户为例。
#
# 1. 首先，根据你的使用场景，选用你需要复制的文件：
#
#    * (a) 优先场景（覆盖默认的 symbols.yaml 字符配置）：使用 `latexmath.yaml` 文件。
#    * (b) 合并场景（将 symbols.yaml 配置合并过来）：使用 `latexmath_compatible.yaml` 文件。
#
# 2. 将在上一步中选择的 YAML 文件复制到 RIME 程序文件夹下的 data 目录中：`RIME/weasel-0.xx/data`。
# 
#    * 如果你选择了合并场景，请将复制后的 `latexmath_compatible.yaml` 文件重命名为 `latexmath.yaml` 。
#
#    或者，可以将该 YAML 文件复制到同步盘，并用符号链接的形式来指向。这样的好处是可以在多个设备上同步该 yaml 文件的更改。下例以 latexmath.yaml 文件与 Onedrive 同步为例：
#    1. 复制文件到 Onedrive 下的 `Sync-Misc\Rime` 文件夹（示例）。该路径可以自定义。
#    2. 以管理员身份运行 Powershell，并切换目录到 Rime 程序文件夹下的 `data` 子文件夹（示例）：
#       ```
#       cd "C:\MyApps\Rime\weasel-0.14.3\data"
#       ```
#    3. 创建一个指向在上述步骤中复制到 Onedrive 的 YAML 文件的符号链接：
#       ```
#       New-Item -ItemType SymbolicLink -Path latexmath.yaml -Target "${env:onedrive}\Sync-Misc\Rime\latexmath.yaml"
#       ```
#       如果使用自定义的 Onedrive 路径，请相应地替换上述命令中的 `\Sync-Misc\Rime` 字符串。
#
# 4. 如上在 data 目录中复制好文件后，打开用户文件夹下微软双拼（`double_pinyin_mspy`）的 `custom` 配置文件 `double_pinyin_mspy.custom.yaml`，更新键值：
#    ```
#    patch:
#      punctuator/import_preset: latexmath
#      recognizer/patterns: 
#        punct: "^/([0-9]0?|[A-Za-z]+)$"
#    ```
# 3. 右键点击托盘区的 RIME 图标，点击“重新部署”以应用更改。
#
# ## 完整的符号支持列表
# 
# 支持的符号：
#
# {{参见 ReadMe}}
#
# ## 贡献与许可证
# 
# 本配置的部分内容来自官方 Weasel 项目部署后的默认 `data/symbols.yaml` 文件。 
#
# 许可证：[GPLv3](./LICENSE)

config_version: '2.0.0'

patch:
  punctuator/import_preset: default
  recognizer/patterns/punct: '^/([0-9]0?|[A-Za-z]+)$'

punctuator:
  full_shape:  # 全角标点模式，不常用
    ' ' : { commit: '　' }
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '/' : [ ／, ÷ ]
    '?' : { commit: ？ }
    ';' : { commit: ； }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, ＼ ]
    '|' : [ ·, ｜, '§', '¦' ]
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    '@' : [ ＠, ☯ ]
    '#' : [ ＃, ⌘ ]
    '%' : [ ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤', ₩ ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : －
    '_' : ——
    '+' : ＋
    '=' : [ ＝, 々, 〃 ]
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
  half_shape:  # 半角标点模式，常用。请自行按需编辑。
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : '《'  # [ 《, 〈, «, ‹ ]
    '>' : '》'  # [ 》, 〉, », › ]
    '/' : [ 、, ､, '/', ／, ÷ ]
    '?' : { commit: ？ }
    ';' : { commit: ； }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    '\' : [ 、, '\', ＼ ]
    '|' : '|'  # [ ·, ・, '|', ｜, '§', '¦', '‖' ]
    '`' : '`'  # [ '`', ‵, ‶, ‷, ′, ″, ‴, ⁗ ]
    '~' : '~'  # [ '~', ～, ˜, ≈, ≋, ≃, ≅, ≇, ∽, ⋍, ≌, ﹏, ﹋, ﹌ ]
    '!' : { commit: ！ }
    '@' : [ '@', ©, ®, ℗ ]
    '#' : '#'  # [ '#', № ]
    '%' : [ '%', ％, ‰, ℃, ℉ ]  # [ '%', ％, '°', '℃', ‰, ‱, ℉ ]
    '$' : ['$', '¥', ￥, '€', '£']  # [ ￥, '$', '€', '£', '¥', '¢', '¤', ₩ ]
    '^' : { commit: …… }
    '&' : '&'
    '*' : [ '*', ＊, ·, ・, ×, ※, ❂, ⁂, ☮, ☯, ☣ ]
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='  # [ '=', 々, 〃 ]
    '[' : 【  # [ 「, 【, 〔, ［ ]
    ']' : 】  # [ 」, 】, 〕, ］ ]
    '{' : [ 『, 「, 〖, 〔, ｛ ]
    '}' : [ 』, 」, 〗, 〕, ｝ ]
  symbols:
    # 【通用符号】
    '/dots': &dots [ …, ⋯, ⋮, ⋰, ⋱ ]
    '/cdots': *dots
    '/ldots': *dots
    '/vdots': *dots
    '/ddots': *dots
    '/forall': ∀
    '/exists': ∃
    '/because': ∵
    '/therefore': ∴
    '/sum': ∑
    '/prod': ∏
    '/sqrt': [ √, ∛, ∜ ]
    '/propto': ∝
    '/ratio': '∶'
    '/inf': &inf ∞
    '/infty': *inf
    '/empty': ∅
    '/log': ㏒
    '/ln': ㏑
    '/hslash': ℏ
    '/sub': &subscript [ ₀, ₁, ₂, ₃, ₄, ₅, ₆, ₇, ₈, ₉, ₙ ]
    '/subnum': *subscript
    '/sup': &supscript [ ⁰, ¹, ², ³, ⁴, ⁵, ⁶, ⁷, ⁸, ⁹, ⁿ ]
    '/supnum': *supscript
    '/degree': [ °, ℃, ℉ ]
    # 通用字母：数集等
    '/ell': ℓ
    '/mathbb': [ ℂ, ℕ, ℙ, ℚ, ℝ, ℤ ]
    '/bbc': ℂ
    '/bbn': [ ℕ, ℕ₀, ℕ₊ ]
    '/bbp': ℙ
    '/bbq': [ ℚ, ℚ₊, ℚ₋ ]
    '/bbr': [ ℝ, ℝ₊, ℝ₋ ]
    '/bbz': [ ℤ, ℤ₊, ℤ₋ ]
    # 【几何】
    '/angle': [ ∠, ∟, ⦜, ⊾, ∡, ∢ ]
    '/parallel': ∥
    '/perp': ⊥
    '/sim': &sim [ ∼, ≃, ≅ ]
    '/simeq': *sim
    '/circle': [ ○, ●, ◎, ◉ ]
    '/sector': [ ⌔, ⌓ ]
    '/arc': [ ◜, ◝, ◞, ◟ ]
    '/ellipse': &ellipse [ ⬭, ⬬, ⬯, ⬮ ]
    '/triangle': [ △, ◺, ◿, ▲, ◁, ◀, ▷, ▶, ▽, ▼, ◣, ◢, ◹, ◥, ◸, ◤ ]
    '/square': [ □, ■ ]
    '/rectangle': &rectangle [ ▭, ▬, ▯, ▮ ]
    '/rect': *rectangle
    '/diamond': &diamond [ ◇, ◆, ◈ ]
    '/lozenge': *diamond
    '/parallelogram': &parallelogram [ ▱, ▰ ]
    '/parm': *parallelogram
    '/polygon': [ ⬠, ⬟, ⬡, ⬢ ]
    # 【微积分】
    '/partial': ∂
    '/nabla': ∇
    '/int': ∫
    '/iint': ∬
    '/iiint': ∭
    '/oint': ∮
    '/oiint': ∯
    '/oiiint': ∰
    # 【二元运算符】
    '/plus': [ +, ⁺, ₊, ⊕ ]
    '/minus': [ -, ⁻, ₋, ⊖ ]
    '/times': [ ×, ⊗, ·, ⊙, ∘, ∙, ⋆, ∗ ]
    '/dot': &dot [ ·, ⊙, ∘, ∙ ]
    '/cdot': *dot
    '/star': [ ⋆, ∗ ]
    '/ast': '∗' 
    '/bullet': ∙
    '/div': [ ÷, ⊘ ]
    '/pm': [ ±, ∓ ]
    ## 集合二元运算符
    '/setop': [ ∪, ∩, ∖, ∨, ∧ ]
    '/cup': ∪
    '/cap': ∩
    '/setminus': ∖
    '/vee': &vee ∨
    '/lor': *vee
    '/wedge': &wedge ∧
    '/land': *wedge
    # 【二元关系符】
    '/eq': [ ≡, ≔, ≈, ≌, ≝, ≜, ≟ ]
    '/approx': ≈
    '/neq': [ ≠, ≶, ≷, ⪋, ⪌ ]
    '/le': [ '<', '≤', '⩽', '≪', '≯' ]
    '/prec': [ ≺, ≼ ] 
    '/ge': [ '>', '≥', '⩾', '≫', '≮' ]
    '/succ': [ ≻, ≽ ]
    ## 集合二元关系符
    '/subset': [ ⊂, ⊆, ⫅, ⫋ ]
    '/supset': [ ⊃, ⊇, ⫆, ⫌ ]
    '/in': ∈
    '/ni': ∋
    '/notin': ∉
    # 【箭头】
    '/implies': [ ⟹, ⇏, ⇒ ]
    '/impliedby': [ ⟸, ⇍, ⇐ ]
    '/iff': [ ⟺, ⇔ ]
    '/left': &left
      - &leftarrow ←  # Leftwards arrow
      - &longleft ⟵  # Long leftwards
      - ⇦  # Leftwards white
      - 🡨  # Wide-headed leftwards barb arrow
      - ↼  # Leftwards harpoon with barb upwards
      - ↽  # Leftwards harpoon with barb downwards
      - ⮘  # Three-D top-lighted leftwards equilateral arrowhead
      - ⮜  # Black leftwards equilateral arrowhead
    '/leftarrow': *left
    '/longleft': *longleft
    '/right': &right
      - &rightarrow →
      - &longright ⟶
      - ⇨
      - 🡪
      - ⮚
      - ⮞
    '/rightarrow': *right
    '/longright': *longright
    '/leftright': [ ↔, ⇄, ⇆, ⇌, ⇋, ⇔ ]  # 双向
    ## 上下两个方向无长箭头
    '/up': &up
      - &uparrow ↑
      - ⇧
      - 🡩
      - ⮙
      - ⮝
    '/uparrow': *up
    '/down': &down
      - &downarrow ↓
      - ⇩
      - 🡫
      - ⮛
      - ⮟
    '/downarrow': *down
    '/updown': [ ↕, ⇅, ⇵, ⥮, ⥯, ⇕ ]  # 双向
    ## 其余四个方向
    '/nwarrow': &nwarrow ↖
    '/nearrow': &nearrow ↗
    '/swarrow': &swarrow ↙
    '/searrow': &searrow ↘
    ## 基础箭头集合
    '/arrow': 
      - *leftarrow
      - *rightarrow
      - *uparrow
      - *downarrow
      - *nwarrow
      - *nearrow
      - *swarrow
      - *searrow
    # 【希腊字母】：/greek, /greekc & /greekv. C for Capitalized, V for Variant.
    '/greek': [ α, β, γ, δ, ϵ, ε, ζ, η, θ, ϑ, ι, κ, ϰ, λ, μ, ν, ξ, ο, π, ϖ, ρ, ϱ, σ, ς, τ, υ, ϕ, φ, χ, ψ, ω ]
    '/greekv': [ ε, ϑ, ϰ, ϖ, ϱ, ς, φ ]
    '/greekc': [ Α, Β, Γ, Δ, Ε, Ζ, Η, Θ, Ι, Κ, Λ, Μ, Ν, Ξ, Ο, Π, Ρ, Σ, Τ, Υ, Φ, Χ, Ψ, Ω ]
    '/alpha': [ α, Α ]
    '/beta': [ β, Β ]
    '/gamma': [ γ, Γ ]
    '/delta': [ δ, Δ ]
    '/epsilon': [ ϵ, ε, Ε ]
    '/varepsilon': ε
    '/zeta': [ ζ, Ζ ]
    '/eta': [ η, Η ]
    '/theta': [ θ, ϑ, Θ ]
    '/vartheta': ϑ
    '/iota': [ ι, Ι ]
    '/kappa': [ κ, ϰ, Κ ]
    '/varkappa': ϰ
    '/lambda': [ λ, Λ ]
    '/mu': [ μ, Μ ]
    '/nu': [ ν, Ν ]
    '/xi': [ ξ, Ξ ]
    '/omicron': [ ο, Ο ]
    '/pi': [ π, ϖ, Π ]
    '/varpi': ϖ
    '/rho': [ ρ, ϱ, Ρ ]
    '/varrho': ϱ
    '/sigma': [ σ, ς, Σ ]
    '/varsigma': ς
    '/tau': [ τ, Τ ]
    '/upsilon': [ υ, Υ ]
    '/phi': [ ϕ, φ, Φ ]
    '/varphi': φ
    '/chi': [ χ, Χ ]
    '/psi': [ ψ, Ψ ]
    '/omega': [ ω, Ω ]
    # 【罗马数字】
    '/roman': [ ⅰ, ⅱ, ⅲ, ⅳ, ⅴ, ⅵ, ⅶ, ⅷ, ⅸ, ⅹ, ⅺ, ⅻ, ⅼ, ⅽ, ⅾ, ⅿ ]
    '/romanc': [ Ⅰ, Ⅱ, Ⅲ, Ⅳ, Ⅴ, Ⅵ, Ⅶ, Ⅷ, Ⅸ, Ⅹ, Ⅺ, Ⅻ, Ⅼ, Ⅽ, Ⅾ, Ⅿ ]
    # 【其他】
    '/gender': [ ♂, ♀, ⚢, ⚣, ⚤, ⚥, ⚦ ]
